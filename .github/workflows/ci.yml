name: ci

on:
  push:
    branches: [master, "vibe/**"]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore mutate4csharp.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build mutate4csharp.sln --configuration Release --no-restore

      - name: Unit tests (with coverage)
        run: >
          dotnet test mutate4csharp.sln --configuration Release --no-build
          --filter "type!=IntegrationTests"
          --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Integration tests
        run: >
          dotnet test mutate4csharp.sln --configuration Release --no-build
          --filter "type=IntegrationTests"
          --results-directory coverage-it

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
